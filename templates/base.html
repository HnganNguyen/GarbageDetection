<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #eef7ee, #d9f2e6);
            font-family: "Segoe UI", sans-serif;
        }

        /* NAVBAR */
        .navbar {
            background: linear-gradient(135deg, #2e7d32, #43a047);
        }

        .navbar-brand,
        .nav-link {
            color: white !important;
            font-weight: 600;
        }

        .nav-link:hover {
            color: #ffeb3b !important;
        }

        .logo-dnc {
            max-height: 42px;
        }

        /* LOGOUT */
        .btn-logout {
            background: #d32f2f;
            color: white !important;
            border-radius: 20px;
            padding: 6px 14px;
            font-weight: 600;
        }

        .btn-logout:hover {
            background: #b71c1c;
        }

        /* FOOTER */
        footer {
            background: #1b5e20;
            color: white;
            padding: 18px;
        }

        footer a {
            color: #ffeb3b;
            text-decoration: none;
            font-weight: 600;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="/home">
            <img src="/static/dnc-logo.png" class="logo-dnc">
            <span>PHÂN LOẠI RÁC</span>
        </a>

        <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto align-items-center gap-2">
                <li class="nav-item"><a class="nav-link" href="/">♻️ Phân loại</a></li>
                <li class="nav-item"><a class="nav-link" href="/leaderboard">🏆 Xếp hạng</a></li>
                <li class="nav-item"><a class="nav-link" href="/history">📜 Lịch sử</a></li>

                {% if is_admin %}
                <li class="nav-item"><a class="nav-link" href="/admin">⚙️ Quản trị</a></li>
                {% endif %}
                <li class="nav-item">
                    <button 
                        class="nav-link border-0 bg-transparent"
                        data-bs-toggle="modal"
                        data-bs-target="#changePasswordModal">

                        🔑 Đổi mật khẩu
                    </button>
                </li>
                <li class="nav-item">
                    <a href="/logout" class="btn btn-logout">Đăng xuất</a>
                </li>
            </ul>   
        </div>
    </div>
</nav>

<div class="container mt-5">
    {% block content %}{% endblock %}
</div>

<footer class="text-center mt-5">
    © 2026 Phân Loại Rác • <a href="/home">Trang chủ</a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
                <!-- Modal đổi mật khẩu -->
     <div class="modal fade" id="changePasswordModal" tabindex="-1">

     <div class="modal-dialog">

        <div class="modal-content rounded-4 shadow-lg border-0">

        <div class="modal-header bg-success text-white rounded-top-4">

          <h5 class="modal-title">
             🔐 Đổi mật khẩu
             </h5>

     <button 
        type="button" 
        class="btn-close btn-close-white"
        data-bs-dismiss="modal">
        </button>

     </div>

        <form method="post" action="/change_password">

        <div class="modal-body">

        <div class="mb-3">

        <label class="form-label">
        Mật khẩu hiện tại
        </label>

        <input
        type="password"
        name="old_password"
        class="form-control"
        required>

        </div>
        <div class="mb-3">

        <label class="form-label">
        Mật khẩu mới
        </label>

        <input
        type="password"
        name="new_password"
        class="form-control"
        required>

        </div>


        <div class="mb-3">

        <label class="form-label">
        Xác nhận mật khẩu mới
        </label>

        <input
        type="password"
        name="confirm_password"
        class="form-control"
        required>

        </div>

        </div>


        <div class="modal-footer">

        <button 
        type="button"
        class="btn btn-secondary"
        data-bs-dismiss="modal">

        Hủy

        </button>

        <button 
        type="submit"
        class="btn btn-success">

        Cập nhật

        </button>

        </div>

        </form>

        </div>

        </div>

        </div>
</body>
</html>
